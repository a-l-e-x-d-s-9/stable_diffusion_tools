<script>
  window.requests = [];
  window.ownershipRequests = [];
  window.fetch = async input => {
    const url = new URL(input, location.href);
    if (url.pathname === '/api/auth/session') return { ok: true, json: async () => ({ user: { id: 7, username: 'alexds9', browsingLevel: 31 } }) };
    if (url.pathname === '/api/v1/images' && url.searchParams.get('userId') === '7') {
      ownershipRequests.push(url.searchParams.get('imageId'));
      return { ok: true, json: async () => ({ items: [{ id: url.searchParams.get('imageId'), username: 'alexds9' }] }) };
    }
    throw new Error(`Unexpected request: ${url}`);
  };
  window.GM_xmlhttpRequest = options => {
    const url = new URL(options.url);
    const reaction = url.searchParams.get('reaction');
    const after = url.searchParams.get('after');
    requests.push({ imageId: url.pathname.split('/')[4], reaction, after });
    const person = id => ({ userId: id, username: `person${id}`, follows: id === 1, reactedAt: '2026-10-01T12:00:00Z' });
    const reactors = reaction === 'Heart' ? [person(1)]
      : after ? [person(14)] : Array.from({ length: 13 }, (_, i) => person(i + 1));
    setTimeout(() => options.onload({ status: 200, responseText: JSON.stringify({
      reaction, reactors, next: reaction === 'Like' && !after ? 'page-2' : null,
      counts: { Like: 14, Heart: 1, Laugh: 0, Cry: 0 },
    }) }), 0);
  };
</script>
